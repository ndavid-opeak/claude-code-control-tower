name: Dependency review

# Fails a pull request that adds a dependency with a known vulnerability (moderate or worse).
on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
